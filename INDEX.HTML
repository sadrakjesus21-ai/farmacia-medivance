<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmácia Medivance</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <!-- CABEÇALHO / NAVBAR -->
  <header class="sticky top-0 z-40 bg-emerald-700 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-white p-2 rounded-full text-emerald-700 font-bold">
          <i class="fa-solid font-bold fa-prescription-bottle-medical text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wide leading-none">Farmácia Medivance</h1>
          <p class="text-xs text-emerald-100 mt-0.5">Sua saúde e bem-estar em primeiro lugar</p>
        </div>
      </div>

      <div class="flex items-center space-x-4">
        <!-- Botão Painel Vendedor -->
        <button onclick="toggleSellerPanel()" class="text-xs bg-emerald-800 hover:bg-emerald-900 px-3 py-1.5 rounded-lg border border-emerald-600 transition flex items-center gap-1.5">
          <i class="fa-solid fa-lock text-xs"></i>
          <span>Vendedor</span>
        </button>

        <!-- Botão Carrinho -->
        <button onclick="toggleCart()" class="relative bg-emerald-600 hover:bg-emerald-500 p-2.5 rounded-xl transition flex items-center justify-center">
          <i class="fa-solid fa-cart-shopping text-lg"></i>
          <span id="cart-count" class="absolute -top-1 -right-1 bg-amber-400 text-slate-900 font-bold text-xs w-5 h-5 rounded-full flex items-center justify-center border-2 border-emerald-700">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- BANNER DE CONTACTO DINÂMICO -->
  <section class="bg-emerald-800 text-emerald-100 text-xs py-2 px-4 shadow-inner">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-2">
      <div class="flex items-center gap-4">
        <span><i class="fa-solid fa-phone mr-1"></i> <span id="display-phone">+244 936 060 694</span></span>
        <span><i class="fa-solid fa-envelope mr-1"></i> <span id="display-email">medivance.org.ao@gmail.com</span></span>
      </div>
      <div class="text-emerald-200">
        <i class="fa-solid fa-truck-fast mr-1"></i> Entregas rápidas disponíveis
      </div>
    </div>
  </section>

  <!-- CONTEÚDO PRINCIPAL (PAINEL COMPRADOR) -->
  <main class="flex-grow max-w-7xl mx-auto px-4 py-6 w-full">
    
    <!-- BARRA DE PESQUISA E FILTROS -->
    <div class="flex flex-col md:flex-row gap-4 mb-6 justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
      <div class="relative w-full md:w-96">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400"></i>
        <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="Pesquisar medicamento ou produto..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
      </div>

      <!-- Filtros por Categoria -->
      <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-1 md:pb-0">
        <button onclick="setCategory('all')" class="category-btn active px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-emerald-600 text-white whitespace-nowrap transition">Todos</button>
        <button onclick="setCategory('Medicamentos')" class="category-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap transition">Medicamentos</button>
        <button onclick="setCategory('Vitaminas')" class="category-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap transition">Vitaminas</button>
        <button onclick="setCategory('Higiene')" class="category-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap transition">Higiene & Cuidados</button>
      </div>
    </div>

    <!-- GRELHA DE PRODUTOS -->
    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Exemplo estático de carregamento -->
      <div class="text-center col-span-full py-12 text-slate-400">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-2"></i>
        <p>A carregar produtos...</p>
      </div>
    </div>
  </main>

  <!-- CARRINHO LATERAL (SLIDE-OVER) -->
  <div id="cart-sidebar" class="fixed inset-0 z-50 overflow-hidden hidden" aria-labelledby="slide-over-title" role="dialog" aria-modal="true">
    <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm transition-opacity" onclick="toggleCart()"></div>

    <div class="pointer-events-none fixed inset-y-0 right-0 flex max-w-full pl-10">
      <div class="pointer-events-auto w-screen max-w-md bg-white shadow-2xl flex flex-col">
        
        <!-- Cabeçalho do Carrinho -->
        <div class="p-4 bg-emerald-700 text-white flex items-center justify-between">
          <h2 class="text-lg font-bold flex items-center gap-2">
            <i class="fa-solid fa-basket-shopping"></i> Seu Carrinho
          </h2>
          <button onclick="toggleCart()" class="p-1 hover:bg-emerald-600 rounded-lg text-white transition">
            <i class="fa-solid fa-xmark text-xl"></i>
          </button>
        </div>

        <!-- Lista de Itens do Carrinho -->
        <div id="cart-items" class="flex-1 overflow-y-auto p-4 divide-y divide-slate-100">
          <p class="text-center text-slate-400 py-8">O seu carrinho está vazio.</p>
        </div>

        <!-- Rodapé do Carrinho -->
        <div class="p-4 bg-slate-50 border-t border-slate-200 space-y-3">
          <div class="flex justify-between items-center text-base font-bold text-slate-800">
            <span>Total:</span>
            <span id="cart-total" class="text-emerald-700">0,00 Kz</span>
          </div>
          <button onclick="checkoutWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30 transition">
            <i class="fa-brands fa-whatsapp text-xl"></i> Finalizar Pedido no WhatsApp
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- MODAL DO PAINEL DE VENDEDOR -->
  <div id="seller-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
      
      <!-- Tela de Login -->
      <div id="seller-login-view">
        <div class="text-center mb-6">
          <div class="w-12 h-12 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto mb-2">
            <i class="fa-solid fa-user-shield text-xl"></i>
          </div>
          <h3 class="text-xl font-bold text-slate-800">Painel do Vendedor</h3>
          <p class="text-xs text-slate-500">Introduza a palavra-passe de acesso</p>
        </div>

        <form onsubmit="handleSellerLogin(event)" class="space-y-4">
          <div>
            <input type="password" id="seller-password" placeholder="Palavra-passe" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
          </div>
          <div class="flex gap-2">
            <button type="button" onclick="toggleSellerPanel()" class="w-1/2 py-2.5 bg-slate-100 text-slate-600 rounded-xl text-sm font-semibold hover:bg-slate-200 transition">Cancelar</button>
            <button type="submit" class="w-1/2 py-2.5 bg-emerald-600 text-white rounded-xl text-sm font-semibold hover:bg-emerald-500 shadow-md transition">Entrar</button>
          </div>
        </form>
      </div>

      <!-- Tela de Definições da Loja (Após Autenticação) -->
      <div id="seller-dashboard-view" class="hidden space-y-4">
        <div class="flex justify-between items-center border-b pb-3">
          <h3 class="text-lg font-bold text-slate-800">Definições da Loja</h3>
          <button onclick="logoutSeller()" class="text-xs text-red-600 hover:underline">Sair</button>
        </div>

        <form onsubmit="saveStoreSettings(event)" class="space-y-3">
          <div>
            <label class="text-xs font-semibold text-slate-600">Telefone / WhatsApp</label>
            <input type="text" id="setting-phone" required class="w-full px-3 py-2 border rounded-xl text-sm mt-1">
          </div>

          <div>
            <label class="text-xs font-semibold text-slate-600">E-mail de Contacto</label>
            <input type="email" id="setting-email" required class="w-full px-3 py-2 border rounded-xl text-sm mt-1">
          </div>

          <div>
            <label class="text-xs font-semibold text-slate-600">Nova Palavra-passe</label>
            <input type="password" id="setting-password" placeholder="Manter atual" class="w-full px-3 py-2 border rounded-xl text-sm mt-1">
          </div>

          <div class="pt-2 flex gap-2">
            <button type="button" onclick="toggleSellerPanel()" class="w-1/2 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-semibold">Fechar</button>
            <button type="submit" class="w-1/2 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold shadow">Guardar</button>
          </div>
        </form>
      </div>

    </div>
  </div>

  <!-- SCRIPT DE FUNCIONALIDADE E LIGAÇÃO AO SUPABASE -->
  <script>
    // Configurações do Supabase (Ajusta se necessário com as tuas chaves públicas)
    const SUPABASE_URL = 'https://ipviguomfrsiexihochs.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_...'; // Mantém a tua chave publica ANON
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Estado da Aplicação
    let currentSettings = { phone: '+244936060694', email: 'medivance.org.ao@gmail.com', password: 'ASPIRINA100MG2026' };
    let cart = [];
    let activeCategory = 'all';

    // Produtos de Exemplo
    const products = [
      { id: 1, name: 'Paracetamol 500mg', category: 'Medicamentos', price: 1500, stock: 'Em Stock', img: 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=300' },
      { id: 2, name: 'Vitamina C 1000mg Efervescente', category: 'Vitaminas', price: 4500, stock: 'Em Stock', img: 'https://images.unsplash.com/photo-1550572017-edd951b55104?w=300' },
      { id: 3, name: 'Ibuprofeno 400mg', category: 'Medicamentos', price: 2200, stock: 'Poucas Unidades', img: 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=300' },
      { id: 4, name: 'Gel Desinfetante 500ml', category: 'Higiene', price: 3000, stock: 'Em Stock', img: 'https://images.unsplash.com/photo-1584483766114-2cea6facdf57?w=300' }
    ];

    // Carregar dados ao iniciar
    window.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      renderProducts();
    });

    // Carregar Definições do Supabase
    async function loadSettings() {
      try {
        const { data, error } = await supabase.from('settings').select('*').eq('id', 'config').single();
        if (data) {
          currentSettings = data;
          document.getElementById('display-phone').innerText = data.phone || currentSettings.phone;
          document.getElementById('display-email').innerText = data.email || currentSettings.email;
        }
      } catch (err) {
        console.log('A usar definições padrão');
      }
    }

    // Renderizar Grelha de Produtos
    function renderProducts() {
      const grid = document.getElementById('products-grid');
      const searchTerm = document.getElementById('search-input').value.toLowerCase();

      const filtered = products.filter(p => {
        const matchesCategory = activeCategory === 'all' || p.category === activeCategory;
        const matchesSearch = p.name.toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400">Nenhum produto encontrado.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="bg-white rounded-2xl shadow-sm hover:shadow-md border border-slate-100 overflow-hidden flex flex-col transition">
          <img src="${p.img}" alt="${p.name}" class="h-40 w-full object-cover">
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">${p.category}</span>
              <h4 class="font-bold text-slate-800 text-sm mt-1">${p.name}</h4>
              <p class="text-xs text-slate-500 mt-0.5">${p.stock}</p>
            </div>
            <div class="mt-4 flex items-center justify-between">
              <span class="font-extrabold text-slate-900 text-base">${p.price.toLocaleString()} Kz</span>
              <button onclick="addToCart(${p.id})" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-xl font-semibold transition flex items-center gap-1">
                <i class="fa-solid fa-plus"></i> Adicionar
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Filtros e Pesquisa
    function filterProducts() { renderProducts(); }
    function setCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.classList.remove('bg-emerald-600', 'text-white');
        btn.classList.add('bg-slate-100', 'text-slate-600');
      });
      event.target.classList.add('bg-emerald-600', 'text-white');
      renderProducts();
    }

    // Gestão do Carrinho
    function toggleCart() {
      document.getElementById('cart-sidebar').classList.toggle('hidden');
    }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const item = cart.find(i => i.id === productId);
      if (item) { item.qty++; } else { cart.push({ ...product, qty: 1 }); }
      updateCartUI();
    }

    function updateCartUI() {
      const countEl = document.getElementById('cart-count');
      const itemsEl = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total');

      const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      countEl.innerText = totalQty;
      totalEl.innerText = `${totalPrice.toLocaleString()} Kz`;

      if (cart.length === 0) {
        itemsEl.innerHTML = `<p class="text-center text-slate-400 py-8">O seu carrinho está vazio.</p>`;
        return;
      }

      itemsEl.innerHTML = cart.map(item => `
        <div class="py-3 flex items-center justify-between">
          <div>
            <h5 class="text-sm font-bold text-slate-800">${item.name}</h5>
            <p class="text-xs text-slate-500">${item.price.toLocaleString()} Kz x ${item.qty}</p>
          </div>
          <div class="flex items-center gap-2">
            <span class="font-bold text-sm text-emerald-700">${(item.price * item.qty).toLocaleString()} Kz</span>
            <button onclick="removeFromCart(${item.id})" class="text-slate-400 hover:text-red-500 text-xs p-1">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    function removeFromCart(id) {
      cart = cart.filter(i => i.id !== id);
      updateCartUI();
    }

    // Finalizar Pedido no WhatsApp
    function checkoutWhatsApp() {
      if (cart.length === 0) { alert('Adicione produtos ao carrinho antes de finalizar.'); return; }
      
      let message = `Olá! Gostaria de fazer o seguinte pedido na *Farmácia Medivance*:\n\n`;
      cart.forEach(i => {
        message += `• *${i.name}* (x${i.qty}) - ${(i.price * i.qty).toLocaleString()} Kz\n`;
      });
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      message += `\n*Total:* ${total.toLocaleString()} Kz`;

      const cleanPhone = (currentSettings.phone || '244936060694').replace(/\D/g, '');
      const url = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');
    }

    // Modal do Vendedor
    function toggleSellerPanel() {
      document.getElementById('seller-modal').classList.toggle('hidden');
    }

    function handleSellerLogin(e) {
      e.preventDefault();
      const pwd = document.getElementById('seller-password').value;
      if (pwd === currentSettings.password) {
        document.getElementById('seller-login-view').classList.add('hidden');
        document.getElementById('seller-dashboard-view').classList.remove('hidden');
        document.getElementById('setting-phone').value = currentSettings.phone || '';
        document.getElementById('setting-email').value = currentSettings.email || '';
      } else {
        alert('Palavra-passe incorreta!');
      }
    }

    function logoutSeller() {
      document.getElementById('seller-login-view').classList.remove('hidden');
      document.getElementById('seller-dashboard-view').classList.add('hidden');
      document.getElementById('seller-password').value = '';
    }

    async function saveStoreSettings(e) {
      e.preventDefault();
      const newPhone = document.getElementById('setting-phone').value;
      const newEmail = document.getElementById('setting-email').value;
      const newPassword = document.getElementById('setting-password').value;

      const updateData = { phone: newPhone, email: newEmail };
      if (newPassword) updateData.password = newPassword;

      try {
        const { error } = await supabase.from('settings').update(updateData).eq('id', 'config');
        if (!error) {
          alert('Definições atualizadas com sucesso!');
          loadSettings();
          toggleSellerPanel();
        } else {
          alert('Erro ao guardar alterações.');
        }
      } catch (err) {
        alert('Erro de ligação ao Supabase.');
      }
    }
  </script>
</body>
</html>
